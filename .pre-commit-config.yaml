# pre-commit install   (then these run on every commit; `make check` runs everything)
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        exclude: ^assets/
      - id: end-of-file-fixer
        exclude: ^assets/
      - id: check-json
      - id: check-yaml
      - id: check-merge-conflict
      - id: check-added-large-files

  - repo: https://github.com/JohnnyMorganz/StyLua
    rev: v2.5.2
    hooks:
      - id: stylua-github

  - repo: local
    hooks:
      - id: selene
        name: selene
        entry: selene
        language: system
        types: [lua]
      - id: typecheck
        name: lua-language-server --check
        entry: make typecheck
        language: system
        pass_filenames: false
        files: ^(lua|plugin)/.*\.lua$
